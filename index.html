<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PXAX · Ai</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07060f;--panel:rgba(18,16,32,.78);--line:rgba(140,120,255,.18);
  --text:#d4d0e8;--mute:#6a6580;--a:#9b7bff;--b:#5ce1e6;--glow:rgba(155,123,255,.28);
}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  -webkit-text-size-adjust:100%;position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 45% at 50% -10%,rgba(120,80,255,.2),transparent 55%),
    radial-gradient(ellipse 80% 50% at 50% 110%,rgba(0,0,0,.75),transparent 55%),
    linear-gradient(180deg,rgba(12,10,24,.2) 0%,transparent 30%,rgba(0,0,0,.35) 100%);
}
#net,#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#net{opacity:.3}#fx{opacity:.45}
#room3d{
  position:fixed;z-index:1;left:50%;top:0;bottom:calc(218px + env(safe-area-inset-bottom));
  width:min(100vw,480px);transform:translateX(-50%);overflow:hidden;touch-action:pan-y;
  transition:opacity .3s ease;
}
#room3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#room3d.chat-mode{opacity:.48;pointer-events:none}
.room-hotspots{position:absolute;inset:0;pointer-events:none}
.room-hotspot{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-height:34px;
  padding:7px 10px;border:1px solid rgba(92,225,230,.45);border-radius:11px;
  color:#e8fcff;background:rgba(5,10,22,.74);font:700 9px/1 system-ui,sans-serif;
  letter-spacing:.65px;white-space:nowrap;box-shadow:0 0 16px rgba(92,225,230,.2);
  backdrop-filter:blur(8px);pointer-events:auto;touch-action:manipulation;
}
.room-hotspot:active{transform:translate(-50%,-50%) scale(.96)}
#scene-loading,#scene-error{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:9px 12px;border-radius:10px;background:rgba(7,6,15,.78);color:#b9f7fa;
  font-size:10px;letter-spacing:.5px;text-align:center;white-space:nowrap;
}
#scene-error{color:#ffb2b2;white-space:normal;max-width:90%}
#scene-error[hidden],#scene-loading[hidden]{display:none}
.noise{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:160px;
}
.wrap{position:relative;z-index:3;height:100vh;height:100dvh;display:flex;flex-direction:column;pointer-events:none}

/* ===== 3D REACTION OVERLAY ===== */
#stage{position:fixed;inset:0;z-index:2;pointer-events:none}
#stage::after{
  content:'';position:fixed;left:50%;top:58%;width:min(64vw,360px);aspect-ratio:1;
  border:1px solid rgba(92,225,230,.0);border-radius:50%;opacity:0;pointer-events:none;
  transform:translate(-50%,-50%) scale(.94);transition:opacity .35s,border-color .35s,box-shadow .35s;
}
#stage.listening::after{
  opacity:1;border-color:rgba(155,123,255,.3);
  box-shadow:0 0 38px rgba(155,123,255,.12),inset 0 0 38px rgba(155,123,255,.06);
  animation:stage-breathe 2.8s ease-in-out infinite;
}
#stage.thinking::after{
  opacity:1;border-color:rgba(92,225,230,.38);
  box-shadow:0 0 48px rgba(92,225,230,.18),inset 0 0 44px rgba(92,225,230,.08);
  animation:stage-breathe 1.8s ease-in-out infinite;
}
@keyframes stage-breathe{50%{transform:translate(-50%,-50%) scale(1.04);opacity:.65}}

/* ===== HOME ===== */
#home{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:24px 20px calc(20px + env(safe-area-inset-bottom));text-align:center;
  position:relative;z-index:2;pointer-events:none;
}
#home.hidden{display:none}
#home>*{pointer-events:auto}
.home-top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0}
.home-title{font-size:22px;font-weight:700;letter-spacing:3px;color:#efeaff}
.home-sub{font-size:11px;color:var(--mute);margin-top:2px;letter-spacing:1.5px}
.home-status{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--b);
  padding:5px 12px;border-radius:20px;border:1px solid rgba(92,225,230,.2);
  background:rgba(10,12,24,.55);margin-top:8px;backdrop-filter:blur(8px);
}
.home-status .d{width:6px;height:6px;border-radius:50%;background:var(--b);box-shadow:0 0 8px var(--b);animation:blink 1.8s ease-in-out infinite}
.home-status.off .d{background:#ff6868;box-shadow:0 0 8px #ff6868}
.home-status.off{color:#ff9c9c;border-color:rgba(255,104,104,.25)}
@keyframes blink{50%{opacity:.35}}
.room-meta{
  position:absolute;top:calc(103px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:12px;
  color:#d8d2f1;background:rgba(10,9,22,.62);border:1px solid rgba(140,120,255,.2);
  backdrop-filter:blur(9px);font-size:10px;white-space:nowrap;z-index:3;
}
.room-meta strong{color:var(--b);font-variant-numeric:tabular-nums}
.room-meta span:last-child{color:#a29ab9}
.home-actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px}
.home-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.btn-main{
  width:100%;padding:16px;border:none;border-radius:14px;font-family:inherit;
  font-size:15px;font-weight:650;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--a),#6b8cff);box-shadow:0 6px 24px var(--glow);
  transition:transform .12s ease;
}
.btn-main:active{transform:scale(.98);opacity:.92}
.btn-apps{
  min-width:0;min-height:76px;padding:8px 4px 7px;border-radius:13px;font-family:inherit;cursor:pointer;
  background:rgba(0,0,0,.52);border:1px solid rgba(0,255,255,.22);backdrop-filter:blur(8px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 0 18px rgba(255,0,170,.1),inset 0 0 18px rgba(0,255,255,.04);
  transition:transform .12s ease;
}
.btn-apps:active{transform:scale(.98);opacity:.92}
.app-icon{font-size:17px;line-height:1;color:#71f2ed;text-shadow:0 0 12px currentColor}
.btn-apps.vpn{border-color:rgba(92,225,230,.28);box-shadow:0 0 18px rgba(0,220,210,.1),inset 0 0 18px rgba(0,255,255,.04)}
.btn-apps.coin{border-color:rgba(255,196,94,.3);box-shadow:0 0 18px rgba(255,178,62,.1),inset 0 0 18px rgba(255,196,94,.04)}
.btn-apps.coin .app-icon{color:#ffd27a}
.btn-apps.vpn .app-icon{color:#65e8ef}
.btn-apps .glitch-title{
  font-size:clamp(11px,3.1vw,14px);font-weight:900;letter-spacing:1.2px;text-transform:uppercase;line-height:1.15;
  color:#fff;font-family:Impact,'Arial Black',system-ui,sans-serif;
  text-shadow:0 0 6px #ff00aa,0 0 14px rgba(255,0,170,.7),0 0 28px rgba(0,255,255,.35),
    2px 0 0 rgba(255,0,100,.5),-2px 0 0 rgba(0,255,255,.4);
  animation:title-blink 1.6s steps(1) infinite;
}
@keyframes title-blink{0%,42%{opacity:1}43%{opacity:.25}44%,86%{opacity:1}87%{opacity:.4}88%,100%{opacity:1}}
.btn-apps .glitch-sub{font-size:8px;letter-spacing:1px;color:rgba(0,255,255,.62);font-weight:600;text-transform:uppercase}
.btn-apps.coin .glitch-sub{color:rgba(255,210,122,.72)}
.home-hint{margin-top:12px;font-size:10.5px;color:var(--mute);line-height:1.4;max-width:290px}
/* ===== CHAT ===== */
#chat-view{display:none;flex-direction:column;height:100%;padding:0 12px;padding-top:max(8px,env(safe-area-inset-top));position:relative;z-index:2;pointer-events:auto}
#chat-view.open{display:flex}
.chat-top{display:flex;align-items:center;gap:10px;padding:8px 0 12px;flex-shrink:0}
.back{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:rgba(10,10,22,.55);color:var(--text);cursor:pointer;backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.mini-dot{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(155,123,255,.4);
  background:radial-gradient(circle at 40% 30%,rgba(155,123,255,.5),rgba(30,20,60,.95));
  display:flex;align-items:center;justify-content:center;
}
.mini-dot .sil{width:15px;height:20px;border-radius:8px;background:linear-gradient(180deg,rgba(230,220,255,.55),rgba(120,100,180,.3))}
.mini-dot.think{border-color:rgba(92,225,230,.55);animation:mini-pulse 1.2s ease-out infinite}
.mini-dot.listen{border-color:rgba(155,123,255,.65);box-shadow:0 0 14px rgba(155,123,255,.22)}
@keyframes mini-pulse{
  0%{box-shadow:0 0 0 0 rgba(92,225,230,.45)}
  70%{box-shadow:0 0 0 10px rgba(92,225,230,0)}
  100%{box-shadow:0 0 0 0 rgba(92,225,230,0)}
}
.chat-top .info{flex:1;min-width:0}
.chat-top .info strong{display:block;font-size:14px;color:#efeaff}
.chat-top .info span{font-size:11px;color:var(--b)}
.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45;word-break:break-word}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px;backdrop-filter:blur(12px)}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(155,123,255,.35),rgba(92,225,230,.12));border:1px solid rgba(155,123,255,.28);border-bottom-right-radius:6px;color:#f0ecff}
.msg .meta{font-size:10px;color:var(--mute);margin-bottom:4px}
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--a);animation:ty 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3}50%{opacity:1;transform:translateY(-3px)}}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;flex-shrink:0;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.chip-s{
  flex-shrink:0;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;
  border:1px solid var(--line);background:rgba(24,20,44,.7);color:var(--text);white-space:nowrap;backdrop-filter:blur(8px);
}
.composer{flex-shrink:0;display:flex;gap:8px;align-items:flex-end;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.composer textarea{
  flex:1;min-height:44px;max-height:110px;resize:none;padding:12px 14px;border-radius:14px;
  font-family:inherit;font-size:15px;background:rgba(20,18,36,.92);border:1px solid var(--line);
  color:var(--text);outline:none;line-height:1.35;backdrop-filter:blur(8px);
}
.composer textarea:focus{border-color:rgba(155,123,255,.5)}
.composer textarea::placeholder{color:var(--mute)}
.send{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--a),#6b8cff);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px var(--glow);
  transition:transform .12s ease;
}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:20px;height:20px}

/* toast */
#toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(24,20,44,.95);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:13px;z-index:50;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;max-width:86%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="net"></canvas>
<canvas id="fx"></canvas>
<div class="noise"></div>
<div id="stage"></div>
<div id="room3d" aria-label="Интерактивная 3D-комната PXAX Ai">
  <div class="room-hotspots">
    <button class="room-hotspot" type="button" data-room-action="bed">ОТДОХНУТЬ</button>
    <button class="room-hotspot" type="button" data-room-action="desk">НОУТБУК</button>
    <button class="room-hotspot" type="button" data-room-action="door">ДВЕРЬ</button>
  </div>
  <div id="scene-loading">ЗАГРУЖАЮ 3D-КОМНАТУ…</div>
  <div id="scene-error" role="alert" hidden></div>
</div>
<div class="wrap">
  <section id="home">
    <div class="home-top">
      <div class="home-title">Ai</div>
      <div class="home-sub">PXAX · neural agent</div>
      <div class="home-status off" id="home-status"><span class="d"></span><span id="mode-label">connecting…</span></div>
    </div>
    <div class="room-meta"><strong id="room-clock">--:--</strong><span>·</span><span id="room-state">Осматривает комнату</span></div>
    <div class="home-actions">
      <button type="button" class="btn-main" id="btn-chat">Начать диалог</button>
      <div class="home-apps" aria-label="Другие приложения">
        <button type="button" class="btn-apps" id="btn-apps" aria-label="Открыть приложение заявок">
          <span class="app-icon" aria-hidden="true">✦</span>
          <span class="glitch-title" id="apps-title">PXAXBET</span>
          <span class="glitch-sub">Заявки</span>
        </button>
        <button type="button" class="btn-apps vpn" id="btn-vpn" aria-label="Открыть приложение VPN">
          <span class="app-icon" aria-hidden="true">⌁</span>
          <span class="glitch-title">VPN</span>
          <span class="glitch-sub">Vph</span>
        </button>
        <button type="button" class="btn-apps coin" id="btn-coin" aria-label="Открыть VibeCoin">
          <span class="app-icon" aria-hidden="true">◈</span>
          <span class="glitch-title">VPHX</span>
          <span class="glitch-sub">VibeCoin</span>
        </button>
      </div>
    </div>
    <p class="home-hint">Коснись кровати, ноутбука или двери — она займётся делом.</p>
  </section>
  <section id="chat-view">
    <div class="chat-top">
      <button type="button" class="back" id="btn-back">‹</button>
      <div class="mini-dot" id="mini-dot"><div class="sil"></div></div>
      <div class="info"><strong>Ai</strong><span id="chat-status">connecting…</span></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="suggest" id="suggest">
      <button type="button" class="chip-s" data-q="Привет! Кто ты?">Кто ты?</button>
      <button type="button" class="chip-s" data-q="Расскажи короткий факт">Факт</button>
      <button type="button" class="chip-s" data-q="Помоги сформулировать идею">Идея</button>
      <button type="button" class="chip-s" data-q="Что такое нейронная сеть простыми словами?">Нейросети</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Сообщение…" maxlength="2000"></textarea>
      <button type="button" class="send" id="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   PXAX · Ai — ядро (UI + чат + 3D-комната)
   ========================================================= */
(function () {
  'use strict';

  var CFG = {
    AI_API_URL: 'https://pxaxai.xstayis.workers.dev',
    APPS_LINK: 'https://t.me/pxaxbetpay_bot',
    VPN_LINK: 'https://xstayis-hue.github.io/Vph/',
    COIN_LINK: 'https://xstayis-hue.github.io/PHXcoin/',
    BOT_NAME: 'pxaxgent',
    TIMEOUT: 28000,
    HISTORY_KEY: 'pxax_ai_history_v3',
    HISTORY_MAX: 80,
    CONTEXT_LEN: 8,
  };

  var $ = function (id) { return document.getElementById(id); };

  var room = { busy: false, status: 'Осматривает комнату' };

  function roomStatus(text) {
    room.status = text;
    $('room-state').textContent = text;
  }

  function roomUpdate(text, busy) {
    room.busy = !!busy;
    roomStatus(text);
  }
  window.pxaxRoomUpdate = roomUpdate;
  window.pxaxRoomToast = toast;

  function roomClock() {
    var now = new Date();
    $('room-clock').textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (!room.busy) {
      var hour = now.getHours();
      roomStatus(hour >= 23 || hour < 7 ? 'В комнате тихая ночь' : hour >= 7 && hour < 12 ? 'Начинается утро' : hour >= 18 ? 'Вечерний отдых' : 'Осматривает комнату');
    }
  }
  roomClock();
  setInterval(roomClock, 15000);

  function roomAction(action, automatic) {
    var messages = {
      bed: ['Устроюсь на минутку…', 'Немного отдыха — и снова за дела 🤍'],
      desk: ['Проверю, что там в ноутбуке.', 'Сейчас закончу мысль…'],
      door: ['Скоро вернусь, не скучай~', 'Вышла ненадолго!']
    };
    if (!Object.prototype.hasOwnProperty.call(messages, action)) return;
    if (!window.pxaxRoom3d) {
      toast('3D-комната загружается…');
      return;
    }
    if (!window.pxaxRoom3d.act(action)) return;
    if (!automatic) {
      haptic('select');
      toast(messages[action][Math.floor(Math.random() * messages[action].length)]);
    }
  }
  window.pxaxRoomAction = roomAction;

  /* --- хранилище с fallback --- */
  var mem = {};
  var storage = {
    getItem: function (k) {
      try { var v = localStorage.getItem(k); if (v != null) return v; } catch (e) {}
      return mem[k] != null ? mem[k] : null;
    },
    setItem: function (k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, v); } catch (e) {}
    }
  };

  /* --- toast --- */
  var toastTimer = null;
  function toast(msg, ms) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2400);
  }

  /* --- Telegram --- */
  var tg = (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;
  var tgUser = null;
  if (tg) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor('#07060f'); } catch (e) {}
    tgUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  }
  function haptic(t) {
    try {
      var h = tg && tg.HapticFeedback;
      if (!h) return;
      if (t === 'success') h.notificationOccurred('success');
      else if (t === 'error') h.notificationOccurred('error');
      else h.selectionChanged();
    } catch (e) {}
  }

  /* --- glitch-заголовок --- */
  (function () {
    var el = $('apps-title'), a = true;
    setInterval(function () { a = !a; el.textContent = a ? 'PXAXBET' : 'PXAXBYTE'; }, 1600);
  })();
  function openApp(url, telegramLink) {
    haptic('select');
    try {
      if (tg && telegramLink && tg.openTelegramLink) { tg.openTelegramLink(url); return; }
      if (tg && !telegramLink && tg.openLink) { tg.openLink(url); return; }
    } catch (e) {}
    window.open(url, '_blank', 'noopener');
  }
  $('btn-apps').onclick = function () { openApp(CFG.APPS_LINK, true); };
  $('btn-vpn').onclick = function () { openApp(CFG.VPN_LINK, false); };
  $('btn-coin').onclick = function () { openApp(CFG.COIN_LINK, false); };

  /* --- фон: нейросеть --- */
  (function () {
    var c = $('net'), ctx = c.getContext('2d'), w, h, nodes = [];
    function resize() {
      w = c.width = window.innerWidth; h = c.height = window.innerHeight;
      var n = Math.min(22, Math.floor((w * h) / 32000));
      nodes = [];
      for (var i = 0; i < n; i++) nodes.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3
      });
    }
    function tick() {
      ctx.clearRect(0, 0, w, h);
      var i, j, p, a, b, dx, dy, d;
      for (i = 0; i < nodes.length; i++) {
        p = nodes[i]; p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      for (i = 0; i < nodes.length; i++) for (j = i + 1; j < nodes.length; j++) {
        a = nodes[i]; b = nodes[j];
        dx = a.x - b.x; dy = a.y - b.y; d = Math.sqrt(dx * dx + dy * dy);
        if (d < 130) {
          ctx.strokeStyle = 'rgba(155,123,255,' + (0.1 * (1 - d / 130)) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      for (i = 0; i < nodes.length; i++) {
        p = nodes[i];
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(92,225,230,.3)'; ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    resize(); window.addEventListener('resize', resize); tick();
  })();

  /* --- фон: частицы --- */
  (function () {
    var c = $('fx'), ctx = c.getContext('2d'), w, h, dots = [];
    function resize() {
      w = c.width = window.innerWidth; h = c.height = window.innerHeight;
      dots = [];
      for (var i = 0; i < 24; i++) dots.push({
        x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.4 + .3,
        vx: (Math.random() - .5) * .2, vy: -.1 - Math.random() * .2, a: Math.random() * .3 + .08
      });
    }
    function tick() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < dots.length; i++) {
        var p = dots[i];
        p.x += p.vx; p.y += p.vy;
        if (p.y < -5) { p.y = h + 4; p.x = Math.random() * w; }
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(155,123,255,' + p.a + ')'; ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    resize(); window.addEventListener('resize', resize); tick();
  })();

  function roomEmote(list) {
    if (!window.pxaxRoom3d) return;
    var name = list.join(' ').toLowerCase();
    window.pxaxRoom3d.emote(/talk/.test(name) ? 'talk' : /tap/.test(name) ? 'tap' : 'listening');
  }

  function roomSpeakAnimation(words) {
    if (window.pxaxRoom3d) window.pxaxRoom3d.speak(words);
  }

  /* =========================================================
     ЧАТ
     ========================================================= */
  var home = $('home'), chatView = $('chat-view'), chatEl = $('chat');
  var input = $('input'), sendBtn = $('send');
  var modeLabel = $('mode-label'), homeStatus = $('home-status'), chatStatus = $('chat-status');
  var miniDot = $('mini-dot');
  var history = [];
  try {
    history = JSON.parse(storage.getItem(CFG.HISTORY_KEY) || '[]');
    if (!Array.isArray(history)) history = [];
  } catch (e) { history = []; }
  var chatBooted = false, busy = false, typingTimer = null, typingActive = false;

  /* --- сеть --- */
  function xhrGet(url, ms, cb) {
    var x = new XMLHttpRequest(), done = false;
    var t = setTimeout(function () {
      if (done) return; done = true;
      try { x.abort(); } catch (e) {}
      cb(false);
    }, ms);
    x.open('GET', url, true); x.timeout = ms;
    x.onload = function () {
      if (done) return; done = true; clearTimeout(t);
      cb(x.status >= 200 && x.status < 500);
    };
    x.onerror = function () { if (!done) { done = true; clearTimeout(t); cb(false); } };
    x.send();
  }
  function xhrPost(url, body, ms, cb) {
    var x = new XMLHttpRequest(), done = false;
    var t = setTimeout(function () {
      if (done) return; done = true;
      try { x.abort(); } catch (e) {}
      cb({ ok: false, text: 'Таймаут ' + (ms / 1000) + 'с — сервер не ответил.' });
    }, ms);
    x.open('POST', url, true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = ms;
    x.onload = function () {
      if (done) return; done = true; clearTimeout(t);
      try {
        var data = JSON.parse(x.responseText || '');
        if (data.reply) cb({ ok: true, text: String(data.reply) });
        else cb({ ok: false, text: 'Пустой ответ сервера (HTTP ' + x.status + ').' });
      } catch (e) {
        cb({ ok: false, text: 'Сервер вернул не-JSON (HTTP ' + x.status + ').' });
      }
    };
    x.onerror = function () { if (!done) { done = true; clearTimeout(t); cb({ ok: false, text: 'Нет связи с сервером.' }); } };
    try { x.send(JSON.stringify(body)); }
    catch (e) { if (!done) { done = true; clearTimeout(t); cb({ ok: false, text: 'send: ' + e.message }); } }
  }

  function setApiStatus(online) {
    modeLabel.textContent = online ? 'online · workers ai' : 'offline · local mode';
    chatStatus.textContent = online ? 'online · ' + CFG.BOT_NAME : 'local mode';
    homeStatus.classList.toggle('off', !online);
  }
  function ping() { xhrGet(CFG.AI_API_URL, 10000, function (ok) { setApiStatus(!!ok); }); }
  ping();
  setInterval(ping, 60000);

  function setThinking(on) {
    miniDot.classList.toggle('think', on);
    $('stage').classList.toggle('thinking', on);
    if (on && window.pxaxRoom3d) window.pxaxRoom3d.emote('thinking');
  }
  function setListening(on) {
    miniDot.classList.toggle('listen', on);
    $('stage').classList.toggle('listening', on);
    if (on && window.pxaxRoom3d) window.pxaxRoom3d.emote('listening');
  }
  function noteTyping() {
    if (busy) return;
    clearTimeout(typingTimer);
    if (input.value.trim()) {
      setListening(true);
      if (!typingActive) {
        typingActive = true;
        roomEmote(['Tap', 'TapBody', 'TapHead']);
      }
      typingTimer = setTimeout(stopTyping, 1400);
    } else {
      stopTyping();
    }
  }
  function stopTyping() {
    clearTimeout(typingTimer);
    typingTimer = null;
    typingActive = false;
    setListening(false);
  }
  function unlock() {
    busy = false;
    sendBtn.disabled = false;
    setThinking(false);
    stopTyping();
    hideTyping();
  }

  function openChat() {
    haptic('select');
    home.classList.add('hidden');
    document.body.classList.add('chat-open');
    if (window.pxaxRoom3d) window.pxaxRoom3d.setMode('chat');
    chatView.classList.add('open');
    unlock();
    if (!chatBooted) {
      chatBooted = true;
      if (history.length) {
        for (var i = 0; i < history.length; i++) addMsg(history[i].role, history[i].text, false);
      } else {
        var name = tgUser && tgUser.first_name;
        addMsg('bot', (name ? name + ', я' : 'Я') + ' на связи. Пиши что угодно — отвечу через нейросеть.', true);
      }
    }
    setTimeout(function () { try { input.focus(); } catch (e) {} }, 250);
  }
  function closeChat() {
    haptic('select');
    unlock();
    chatView.classList.remove('open');
    home.classList.remove('hidden');
    document.body.classList.remove('chat-open');
    if (window.pxaxRoom3d) window.pxaxRoom3d.setMode('room');
  }
  $('btn-chat').onclick = openChat;
  $('btn-back').onclick = closeChat;

  /* --- сообщения --- */
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function saveHistory() {
    if (history.length > CFG.HISTORY_MAX) history = history.slice(-CFG.HISTORY_MAX);
    try { storage.setItem(CFG.HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
  }
  function addMsg(role, text, save) {
    if (save === undefined) save = true;
    var div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    if (role === 'bot') {
      div.innerHTML = '<div class="meta">' + CFG.BOT_NAME + '</div>' + escapeHtml(text).replace(/\n/g, '<br>');
    } else {
      div.textContent = text;
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    if (save) { history.push({ role: role, text: text, t: Date.now() }); saveHistory(); }
  }
  /* печать по словам + lip-sync у модели */
  function addMsgStream(text) {
    var div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = '<div class="meta">' + CFG.BOT_NAME + '</div><span class="stream-body"></span>';
    chatEl.appendChild(div);
    var body = div.querySelector('.stream-body');
    var words = String(text).split(/(\s+)/);
    roomSpeakAnimation(words.length);
    var i = 0;
    function step() {
      if (i >= words.length) {
        history.push({ role: 'bot', text: text, t: Date.now() });
        saveHistory();
        return;
      }
      body.textContent += words[i];
      i++;
      chatEl.scrollTop = chatEl.scrollHeight;
      setTimeout(step, words[i - 1] && words[i - 1].trim() ? 28 : 8);
    }
    step();
  }
  function showTyping() {
    hideTyping();
    var div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing';
    div.innerHTML = '<div class="meta">' + CFG.BOT_NAME + '</div><div class="typing"><span></span><span></span><span></span></div>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping() {
    var t = $('typing');
    if (t) t.remove();
  }

  /* локальный fallback-мозг (если workers лежит) */
  function localReply(text) {
    var t = text.toLowerCase();
    if (/привет|здравств|хай|йо/.test(t)) return 'Привет! Я локальная копия Ai — основной сервер сейчас недоступен, но на простые вопросы отвечу и так.';
    if (/кто ты|что ты/.test(t)) return 'Я Ai — нейро-агент экосистемы PXAX. Сейчас работаю в локальном режиме: workers-сервер оффлайн.';
    if (/факт/.test(t)) return 'Факт: первые нейросети (перцептрон Розенблатта) появились в 1957 году — задолго до интернета.';
    if (/идея|помоги/.test(t)) return 'Давай так: опиши задачу в двух предложениях — что за продукт и для кого. Я помогу разложить на шаги. (Локальный режим — отвечаю шаблонами.)';
    if (/нейросет/.test(t)) return 'Нейросеть — это функция с миллионами подкручиваемых параметров. Она учится на примерах: показываешь вход и правильный ответ, она чуть-чуть подкручивает веса, чтобы ошибиться меньше. Миллионы таких подкруток — и сеть «понимает» закономерности.';
    if (/как дела|как ты/.test(t)) return 'Работаю в деградированном режиме, но держусь! Когда вернётся workers — стану умнее в разы.';
    return 'Сервер ИИ сейчас оффлайн, поэтому отвечаю заготовками. Попробуй позже или спроси что-то простое: «факт», «кто ты», «нейросети».';
  }

  function send(text) {
    text = (text || input.value || '').trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    stopTyping();
    input.value = '';
    autoSize();
    haptic('select');
    addMsg('user', text, true);
    setThinking(true);
    showTyping();

    xhrPost(CFG.AI_API_URL, {
      message: text,
      history: history.slice(-CFG.CONTEXT_LEN).map(function (m) { return { role: m.role, text: m.text }; })
    }, CFG.TIMEOUT, function (res) {
      hideTyping();
      setThinking(false);
      if (res.ok) {
        haptic('success');
        setApiStatus(true);
        addMsgStream(res.text);
      } else {
        haptic('error');
        setApiStatus(false);
        addMsgStream(localReply(text));
      }
      unlock();
      try { input.focus(); } catch (e) {}
    });
  }

  function autoSize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  }
  sendBtn.onclick = function () { send(); };
  input.oninput = function () { autoSize(); noteTyping(); };
  input.onkeydown = function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };
  $('suggest').onclick = function (e) {
    var b = e.target.closest('[data-q]');
    if (b) send(b.getAttribute('data-q'));
  };
})();
</script>
