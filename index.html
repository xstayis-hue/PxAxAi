<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PXAX · Ai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07060f;
  --panel:rgba(18,16,32,.75);
  --line:rgba(140,120,255,.18);
  --text:#d4d0e8;
  --mute:#6a6580;
  --a:#9b7bff;
  --b:#5ce1e6;
  --glow:rgba(155,123,255,.25);
}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  min-height:100vh;min-height:100dvh;
  -webkit-text-size-adjust:100%;
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 50% at 50% -20%,rgba(120,80,255,.22),transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(60,200,220,.1),transparent 50%),
    radial-gradient(ellipse 40% 30% at 10% 60%,rgba(155,123,255,.08),transparent 45%);
}
.orb{
  position:fixed;width:180px;height:180px;border-radius:50%;
  top:12%;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle at 40% 35%,rgba(200,180,255,.35),rgba(90,60,180,.15) 45%,transparent 70%);
  filter:blur(8px);z-index:0;pointer-events:none;
  animation:orb-breathe 6s ease-in-out infinite;
}
@keyframes orb-breathe{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;padding:12px 12px 0;padding-bottom:0}

.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 12px;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(145deg,rgba(155,123,255,.4),rgba(92,225,230,.25));
  border:1px solid rgba(155,123,255,.35);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px var(--glow);
  position:relative;
}
.avatar::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(92,225,230,.25);animation:ring 3s linear infinite;
}
@keyframes ring{to{transform:rotate(360deg);border-color:rgba(155,123,255,.3)}}
.avatar svg{width:22px;height:22px}
.brand h1{font-size:16px;font-weight:650;letter-spacing:.5px;color:#efeaff}
.brand p{font-size:10px;color:var(--mute);margin-top:1px}
.status-chip{
  font-size:10px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--b);background:rgba(92,225,230,.06);
  display:flex;align-items:center;gap:6px;
}
.status-chip .d{width:6px;height:6px;border-radius:50%;background:var(--b);box-shadow:0 0 8px var(--b);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

.chat{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:8px 4px 16px;display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.msg{
  max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45;
  animation:in .25s ease;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{
  align-self:flex-start;
  background:var(--panel);border:1px solid var(--line);
  border-bottom-left-radius:6px;color:var(--text);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(155,123,255,.35),rgba(92,225,230,.15));
  border:1px solid rgba(155,123,255,.3);
  border-bottom-right-radius:6px;color:#f0ecff;
}
.msg .meta{font-size:10px;color:var(--mute);margin-bottom:4px}
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{
  width:6px;height:6px;border-radius:50%;background:var(--a);
  animation:ty 1.2s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

.suggest{
  display:flex;gap:8px;overflow-x:auto;padding:0 4px 10px;flex-shrink:0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.suggest::-webkit-scrollbar{display:none}
.chip-s{
  flex-shrink:0;padding:8px 12px;border-radius:20px;font-size:12px;
  border:1px solid var(--line);background:rgba(155,123,255,.08);color:var(--text);
  cursor:pointer;white-space:nowrap;
}
.chip-s:active{background:rgba(155,123,255,.2)}

.composer{
  flex-shrink:0;padding:10px 4px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:flex-end;
  background:linear-gradient(180deg,transparent,rgba(7,6,15,.92) 30%);
}
.composer textarea{
  flex:1;min-height:44px;max-height:120px;resize:none;
  padding:12px 14px;border-radius:14px;font-family:inherit;font-size:15px;
  background:rgba(20,18,36,.9);border:1px solid var(--line);color:var(--text);
  outline:none;line-height:1.35;
}
.composer textarea:focus{border-color:rgba(155,123,255,.45);box-shadow:0 0 0 1px rgba(155,123,255,.15)}
.composer textarea::placeholder{color:var(--mute)}
.send{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--a),#6b8cff);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px var(--glow);
}
.send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.send svg{width:20px;height:20px}

.foot{text-align:center;font-size:9px;color:#3a3550;padding-bottom:6px;letter-spacing:.5px;flex-shrink:0}
</style>
</head>
<body>
<div class="orb"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="#c8b8ff" stroke-width="1.5">
          <circle cx="12" cy="10" r="4"/>
          <path d="M6 20c1.5-3 4-4.5 6-4.5s4.5 1.5 6 4.5"/>
          <circle cx="12" cy="10" r="1.2" fill="#5ce1e6" stroke="none"/>
        </svg>
      </div>
      <div>
        <h1>Ai</h1>
        <p>PXAX · neural node</p>
      </div>
    </div>
    <div class="status-chip"><span class="d"></span><span id="mode-label">local</span></div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="suggest" id="suggest">
    <button type="button" class="chip-s" data-q="Кто ты?">Кто ты?</button>
    <button type="button" class="chip-s" data-q="Что умеешь?">Что умеешь?</button>
    <button type="button" class="chip-s" data-q="Расскажи про PXAX">Про PXAX</button>
    <button type="button" class="chip-s" data-q="Как работает Vph?">Про Vph</button>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Напиши сообщение…" maxlength="2000"></textarea>
    <button type="button" class="send" id="send" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <div class="foot">v0.1 · Ai · PXAX ecosystem</div>
</div>

<script>
/* ===== НАСТРОЙКИ ===== */
const AI_API_URL = ''; // позже: URL прокси (Gemini / свой сервер / Ollama)
const BOT_NAME = 'Ai';
/* ===================== */

const storage = (() => {
  try { return localStorage; } catch {
    const d = {};
    return { getItem: k => d[k] || null, setItem: (k, v) => { d[k] = v; } };
  }
})();

let tgUser = null;
if (window.Telegram?.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  try { Telegram.WebApp.setHeaderColor('#07060f'); } catch (e) {}
  tgUser = Telegram.WebApp.initDataUnsafe?.user || null;
}

const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const modeLabel = document.getElementById('mode-label');

if (AI_API_URL) modeLabel.textContent = 'online';
else modeLabel.textContent = 'local';

const HISTORY_KEY = 'pxax_ai_history';
let history = [];
try { history = JSON.parse(storage.getItem(HISTORY_KEY) || '[]'); } catch { history = []; }

function haptic(t) {
  try {
    const h = window.Telegram?.WebApp?.HapticFeedback;
    if (!h) return;
    if (t === 'success') h.notificationOccurred('success');
    else h.selectionChanged();
  } catch (e) {}
}

function addMsg(role, text, save = true) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (role === 'bot') {
    div.innerHTML = '<div class="meta">' + BOT_NAME + '</div>' + escapeHtml(text).replace(/\n/g, '<br>');
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (save) {
    history.push({ role, text, t: Date.now() });
    if (history.length > 80) history = history.slice(-80);
    storage.setItem(HISTORY_KEY, JSON.stringify(history));
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = '<div class="meta">' + BOT_NAME + '</div><div class="typing"><span></span><span></span><span></span></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

/* Локальные ответы v0.1 — заглушка до подключения модели */
function localReply(q) {
  const s = q.toLowerCase().trim();
  const name = tgUser?.first_name || 'человек';

  if (/кто ты|представ|имя/.test(s)) {
    return 'Я Ai — neural-узел экосистемы PXAX. Пока работаю в локальном режиме: помню контекст чата на устройстве и жду подключения живой модели.';
  }
  if (/умеешь|можешь|функц|что дела/.test(s)) {
    return 'Сейчас: диалог, подсказки по PXAX / Vph / PhxCoin, память сессии.\nСкоро: реальный LLM, эмоции, голос и связь с профилем экосистемы.';
  }
  if (/pxax|экосистем|проект/.test(s)) {
    return 'PXAX — экосистема мини-приложений в Telegram:\n• заявки и профиль\n• Vph — доступ Phoenix\n• Ai — я\n• дальше PhxCoin и модули';
  }
  if (/vph|vpn|подписк|happ/.test(s)) {
    return 'Vph — отдельное приложение доступа. Оформление подписки, ключ для Happ, статус «активна / не активна / истекла». Открой бота Vph в экосистеме.';
  }
  if (/phx|коин|тон|token|монет/.test(s)) {
    return 'PhxCoin готовится в сети TON. В аппе заявок уже есть блок с курсом TON и местом под контракт после деплоя.';
  }
  if (/привет|здравств|hey|hello|ку\b/.test(s)) {
    return 'Привет, ' + name + '. Я на связи. Спроси про PXAX или просто напиши, что нужно.';
  }
  if (/спасибо|благодар/.test(s)) {
    return 'Всегда пожалуйста. Neural node не устаёт.';
  }
  if (/помощь|help|команд/.test(s)) {
    return 'Просто пиши обычным языком. Быстрые темы: кто ты, PXAX, Vph, PhxCoin, что умеешь.';
  }

  const fallbacks = [
    'Приняла. В local-режиме отвечаю шаблонами — подключи модель, и я стану умнее. Пока могу рассказать про экосистему PXAX.',
    'Сигнал получен. Пока я без полного LLM: уточни вопрос про PXAX, Vph или PhxCoin — или оставь это как заметку на потом.',
    'Слышу тебя. Расширенный интеллект подключится через AI_API_URL. До этого — гид по проекту и лёгкий диалог.'
  ];
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

async function getReply(userText) {
  if (!AI_API_URL) {
    await delay(400 + Math.random() * 500);
    return localReply(userText);
  }
  try {
    const res = await fetch(AI_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userText,
        history: history.slice(-12),
        user: tgUser ? { id: tgUser.id, name: tgUser.first_name } : null
      })
    });
    if (!res.ok) throw new Error('api');
    const data = await res.json();
    return data.reply || data.text || localReply(userText);
  } catch (e) {
    return localReply(userText) + '\n\n(online недоступен — local fallback)';
  }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

let busy = false;
async function send(text) {
  text = (text || input.value).trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  autoSize();
  haptic('select');
  addMsg('user', text);
  showTyping();
  const reply = await getReply(text);
  hideTyping();
  addMsg('bot', reply);
  haptic('success');
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}

function autoSize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}

sendBtn.addEventListener('click', () => send());
input.addEventListener('input', autoSize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

document.getElementById('suggest').addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (b) send(b.dataset.q);
});

/* старт */
if (history.length) {
  history.forEach(m => addMsg(m.role, m.text, false));
} else {
  const name = tgUser?.first_name;
  addMsg('bot', (name ? name + ', п' : 'П') + 'ривет. Я Ai — узел экосистемы PXAX. Пока local-режим: можно болтать и спрашивать про проект. Живая модель подключится позже.');
}
</script>
</body>
</html>
