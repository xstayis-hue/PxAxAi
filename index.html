<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PXAX · Ai</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07060f;--panel:rgba(18,16,32,.78);--line:rgba(140,120,255,.18);
  --text:#d4d0e8;--mute:#6a6580;--a:#9b7bff;--b:#5ce1e6;--glow:rgba(155,123,255,.28);
}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  -webkit-text-size-adjust:100%;position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 45% at 50% -10%,rgba(120,80,255,.2),transparent 55%),
    radial-gradient(ellipse 80% 50% at 50% 110%,rgba(0,0,0,.75),transparent 55%),
    linear-gradient(180deg,rgba(12,10,24,.2) 0%,transparent 30%,rgba(0,0,0,.35) 100%);
}
#fx,#net{position:fixed;inset:0;z-index:0;pointer-events:none}
#fx{opacity:.5}#net{opacity:.35}
.parallax-layer{
  position:fixed;inset:-8%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(155,123,255,.12),transparent 60%);
  transition:transform .15s ease-out;will-change:transform;
}
.noise{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:160px;
}
.wrap{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column}
#home{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;
}
#home.hidden{display:none}
.char-stage{
  perspective:600px;margin-bottom:22px;
  width:180px;height:180px;display:flex;align-items:center;justify-content:center;
}
.char-slot{
  position:relative;width:168px;height:168px;
  transform-style:preserve-3d;transition:transform .12s ease-out;will-change:transform;
}
.char-slot .halo{
  position:absolute;inset:-28px;border-radius:50%;
  background:radial-gradient(circle,rgba(155,123,255,.42),rgba(92,225,230,.08) 45%,transparent 70%);
  filter:blur(16px);animation:halo-breathe 5s ease-in-out infinite;pointer-events:none;
}
.char-slot.think .halo{
  background:radial-gradient(circle,rgba(92,225,230,.5),rgba(155,123,255,.15) 50%,transparent 70%);
  animation:halo-think 1.1s ease-in-out infinite;
}
@keyframes halo-breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes halo-think{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
.char-slot .ring{
  position:absolute;inset:-10px;border-radius:50%;
  border:1px solid rgba(92,225,230,.22);animation:spin 14s linear infinite;pointer-events:none;
}
.char-slot .ring2{
  position:absolute;inset:-18px;border-radius:50%;
  border:1px dashed rgba(155,123,255,.18);animation:spin 22s linear infinite reverse;pointer-events:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.char-core{
  position:relative;width:168px;height:168px;border-radius:50%;
  border:1px solid rgba(200,180,255,.35);
  background:radial-gradient(circle at 40% 28%,rgba(180,160,255,.45),rgba(40,30,80,.88) 52%,rgba(16,12,32,.98));
  box-shadow:0 0 40px rgba(155,123,255,.22),inset 0 -8px 24px rgba(0,0,0,.35),inset 0 8px 20px rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;overflow:hidden;transform-style:preserve-3d;
}
.sil-wrap{position:relative;width:72px;height:100px;transform-style:preserve-3d}
.sil-wrap .s{
  position:absolute;left:50%;top:0;width:72px;height:96px;margin-left:-36px;
  border-radius:36px 36px 22px 22px;
  background:linear-gradient(180deg,rgba(230,220,255,.55),rgba(120,100,180,.22));
}
.sil-wrap .s1{transform:translateZ(12px);opacity:.85;animation:sil-y 3.5s ease-in-out infinite}
.sil-wrap .s2{transform:translateZ(4px) translateX(3px);opacity:.25;filter:blur(2px);background:rgba(40,20,80,.6)}
.sil-wrap .s3{transform:translateZ(0) translateX(-4px);opacity:.15;filter:blur(4px);background:rgba(92,225,230,.3)}
@keyframes sil-y{0%,100%{transform:translateZ(12px) translateY(0)}50%{transform:translateZ(12px) translateY(-4px)}}
.char-core .slot-tag{
  position:absolute;bottom:12px;left:50%;transform:translateX(-50%) translateZ(14px);
  font-size:9px;letter-spacing:.6px;color:var(--b);
  background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px;white-space:nowrap;
}
.home-title{font-size:28px;font-weight:700;letter-spacing:2px;color:#efeaff;margin-bottom:6px}
.home-sub{font-size:13px;color:var(--mute);margin-bottom:8px;letter-spacing:1px}
.home-status{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--b);
  padding:6px 12px;border-radius:20px;border:1px solid rgba(92,225,230,.2);
  background:rgba(92,225,230,.06);margin-bottom:26px;
}
.home-status .d{width:6px;height:6px;border-radius:50%;background:var(--b);box-shadow:0 0 8px var(--b);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.home-actions{width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px}
.btn-main{
  width:100%;padding:16px;border:none;border-radius:14px;font-family:inherit;
  font-size:15px;font-weight:650;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--a),#6b8cff);box-shadow:0 6px 24px var(--glow);
}
.btn-main:active{transform:scale(.98);opacity:.92}
.btn-apps{
  width:100%;padding:14px 12px 12px;border-radius:14px;font-family:inherit;cursor:pointer;
  background:rgba(0,0,0,.35);border:1px solid rgba(0,255,255,.22);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 0 24px rgba(255,0,170,.12),inset 0 0 20px rgba(0,255,255,.04);
}
.btn-apps:active{transform:scale(.98);opacity:.92}
.btn-apps .glitch-title{
  font-size:20px;font-weight:900;letter-spacing:3px;text-transform:uppercase;line-height:1.15;
  color:#fff;font-family:Impact,'Arial Black',system-ui,sans-serif;
  text-shadow:0 0 6px #ff00aa,0 0 14px rgba(255,0,170,.7),0 0 28px rgba(0,255,255,.35),
    2px 0 0 rgba(255,0,100,.5),-2px 0 0 rgba(0,255,255,.4);
  animation:title-blink 1.6s steps(1) infinite;
}
@keyframes title-blink{
  0%,42%{opacity:1;filter:none}43%{opacity:.25;filter:hue-rotate(40deg)}
  44%,86%{opacity:1;filter:none}87%{opacity:.4;transform:translateX(1px)}
  88%,100%{opacity:1;transform:none}
}
.btn-apps .glitch-sub{font-size:10px;letter-spacing:2px;color:rgba(0,255,255,.55);font-weight:500;text-transform:lowercase}
.home-hint{margin-top:18px;font-size:11px;color:var(--mute);line-height:1.45;max-width:290px}
.home-foot{position:absolute;bottom:12px;left:0;right:0;font-size:9px;color:#3a3550;letter-spacing:.5px}
#chat-view{
  display:none;flex-direction:column;height:100%;padding:0 12px;
  padding-top:max(8px,env(safe-area-inset-top));
}
#chat-view.open{display:flex;animation:fadein .28s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.chat-top{display:flex;align-items:center;gap:10px;padding:8px 0 12px;flex-shrink:0}
.back{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.mini-slot{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(155,123,255,.4);
  background:radial-gradient(circle at 40% 30%,rgba(155,123,255,.4),rgba(30,20,60,.95));
  box-shadow:0 0 12px rgba(155,123,255,.2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.mini-slot.think{border-color:rgba(92,225,230,.55);animation:mini-pulse 1.2s ease-out infinite}
@keyframes mini-pulse{
  0%{box-shadow:0 0 0 0 rgba(92,225,230,.45)}
  70%{box-shadow:0 0 0 10px rgba(92,225,230,0)}
  100%{box-shadow:0 0 0 0 rgba(92,225,230,0)}
}
.mini-slot .sil{
  width:18px;height:24px;border-radius:10px;
  background:linear-gradient(180deg,rgba(230,220,255,.5),rgba(120,100,180,.3));
}
.chat-top .info{flex:1;min-width:0}
.chat-top .info strong{display:block;font-size:14px;color:#efeaff}
.chat-top .info span{font-size:11px;color:var(--b)}
.chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 12px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.bot{
  align-self:flex-start;background:var(--panel);border:1px solid var(--line);
  border-bottom-left-radius:6px;backdrop-filter:blur(12px);animation:reveal .45s ease forwards;
}
@keyframes reveal{from{opacity:0;filter:blur(6px);transform:translateY(6px)}to{opacity:1;filter:blur(0);transform:none}}
.msg.user{
  align-self:flex-end;background:linear-gradient(135deg,rgba(155,123,255,.35),rgba(92,225,230,.12));
  border:1px solid rgba(155,123,255,.28);border-bottom-right-radius:6px;color:#f0ecff;animation:in .25s ease;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg .meta{font-size:10px;color:var(--mute);margin-bottom:4px}
.typing{display:flex;gap:4px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--a);animation:ty 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3}50%{opacity:1;transform:translateY(-3px)}}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;flex-shrink:0;scrollbar-width:none}
.suggest::-webkit-scrollbar{display:none}
.chip-s{
  flex-shrink:0;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;
  border:1px solid var(--line);background:rgba(155,123,255,.08);color:var(--text);white-space:nowrap;
}
.composer{
  flex-shrink:0;display:flex;gap:8px;align-items:flex-end;
  padding:8px 0 calc(10px + env(safe-area-inset-bottom));
}
.composer textarea{
  flex:1;min-height:44px;max-height:110px;resize:none;padding:12px 14px;border-radius:14px;
  font-family:inherit;font-size:15px;background:rgba(20,18,36,.95);border:1px solid var(--line);
  color:var(--text);outline:none;line-height:1.35;
}
.composer textarea:focus{border-color:rgba(155,123,255,.5);animation:input-wave 1.8s ease-in-out infinite}
@keyframes input-wave{
  0%,100%{box-shadow:0 0 0 1px rgba(155,123,255,.2),0 0 20px rgba(155,123,255,.1)}
  50%{box-shadow:0 0 0 1px rgba(92,225,230,.35),0 0 28px rgba(92,225,230,.12)}
}
.composer textarea::placeholder{color:var(--mute)}
.send{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,var(--a),#6b8cff);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px var(--glow);
}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="parallax-layer" id="parallax"></div>
<canvas id="net"></canvas>
<canvas id="fx"></canvas>
<div class="noise"></div>
<div class="wrap">
  <section id="home">
    <div class="char-stage">
      <div class="char-slot" id="char-slot">
        <div class="halo"></div><div class="ring"></div><div class="ring2"></div>
        <div class="char-core">
          <div class="sil-wrap" aria-hidden="true">
            <div class="s s3"></div><div class="s s2"></div><div class="s s1"></div>
          </div>
          <span class="slot-tag">avatar soon</span>
        </div>
      </div>
    </div>
    <div class="home-title">Ai</div>
    <div class="home-sub">PXAX · neural companion</div>
    <div class="home-status"><span class="d"></span><span id="mode-label">connecting…</span></div>
    <div class="home-actions">
      <button type="button" class="btn-main" id="btn-chat">Начать диалог</button>
      <button type="button" class="btn-apps" id="btn-apps">
        <span class="glitch-title" id="apps-title">PXAXBET</span>
        <span class="glitch-sub">заявки</span>
      </button>
    </div>
    <p class="home-hint">Тестовая версия приложения. Будет обновляться — интерфейс, персонаж и ИИ.</p>
    <div class="home-foot">v0.4 · Ai · PXAX ecosystem</div>
  </section>
  <section id="chat-view">
    <div class="chat-top">
      <button type="button" class="back" id="btn-back">‹</button>
      <div class="mini-slot" id="mini-slot"><div class="sil"></div></div>
      <div class="info"><strong>Ai</strong><span id="chat-status">online</span></div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="suggest" id="suggest">
      <button type="button" class="chip-s" data-q="Привет! Кто ты?">Кто ты?</button>
      <button type="button" class="chip-s" data-q="Расскажи короткий факт">Факт</button>
      <button type="button" class="chip-s" data-q="Помоги сформулировать идею">Идея</button>
      <button type="button" class="chip-s" data-q="Что такое нейронная сеть простыми словами?">Нейросети</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Сообщение…" maxlength="2000"></textarea>
      <button type="button" class="send" id="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</div>
<script>
const AI_API_URL = 'https://pxaxai.xstayis.workers.dev';
const APPS_LINK = 'https://t.me/pxaxbetpay_bot';
const BOT_NAME = 'Ai';

const storage = (() => {
  try { return localStorage; } catch {
    const d = {};
    return { getItem: k => d[k] || null, setItem: (k, v) => { d[k] = v; } };
  }
})();

let tgUser = null;
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  try { Telegram.WebApp.setHeaderColor('#07060f'); } catch (e) {}
  tgUser = Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user || null;
}

(function () {
  var el = document.getElementById('apps-title');
  var a = true;
  setInterval(function () {
    a = !a;
    el.textContent = a ? 'PXAXBET' : 'PXAXBYTE';
  }, 1600);
})();

function openApps() {
  try {
    if (Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
      Telegram.WebApp.HapticFeedback.selectionChanged();
    }
  } catch (e) {}
  var url = APPS_LINK;
  try {
    if (Telegram && Telegram.WebApp && Telegram.WebApp.openTelegramLink) {
      Telegram.WebApp.openTelegramLink(url);
      return;
    }
  } catch (e1) {}
  try {
    if (Telegram && Telegram.WebApp && Telegram.WebApp.openLink) {
      Telegram.WebApp.openLink(url);
      return;
    }
  } catch (e2) {}
  window.location.href = url;
}
document.getElementById('btn-apps').addEventListener('click', openApps);

var parallax = document.getElementById('parallax');
var charSlot = document.getElementById('char-slot');
var tiltX = 0, tiltY = 0, targetTX = 0, targetTY = 0;
function onPointer(clientX, clientY) {
  var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  var dx = (clientX - cx) / cx, dy = (clientY - cy) / cy;
  targetTX = dy * -10; targetTY = dx * 12;
  parallax.style.transform = 'translate(' + (dx * 12) + 'px,' + (dy * 10) + 'px)';
}
function resetTilt() { targetTX = 0; targetTY = 0; parallax.style.transform = 'translate(0,0)'; }
window.addEventListener('pointermove', function (e) { onPointer(e.clientX, e.clientY); }, { passive: true });
window.addEventListener('pointerleave', resetTilt);
window.addEventListener('touchmove', function (e) {
  if (e.touches[0]) onPointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', resetTilt);
(function tiltLoop() {
  tiltX += (targetTX - tiltX) * 0.08;
  tiltY += (targetTY - tiltY) * 0.08;
  charSlot.style.transform = 'rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg)';
  requestAnimationFrame(tiltLoop);
})();

(function neural() {
  var c = document.getElementById('net'); var ctx = c.getContext('2d');
  var w, h, nodes = [];
  function resize() {
    w = c.width = window.innerWidth; h = c.height = window.innerHeight;
    var n = Math.min(28, Math.floor((w * h) / 28000));
    nodes = [];
    for (var i = 0; i < n; i++) {
      nodes.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.35, vy: (Math.random() - 0.5) * 0.35
      });
    }
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    var i, j, p, a, b, dx, dy, d;
    for (i = 0; i < nodes.length; i++) {
      p = nodes[i]; p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
    for (i = 0; i < nodes.length; i++) {
      for (j = i + 1; j < nodes.length; j++) {
        a = nodes[i]; b = nodes[j];
        dx = a.x - b.x; dy = a.y - b.y; d = Math.sqrt(dx * dx + dy * dy);
        if (d < 140) {
          ctx.strokeStyle = 'rgba(155,123,255,' + (0.12 * (1 - d / 140)) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (i = 0; i < nodes.length; i++) {
      p = nodes[i];
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(92,225,230,.35)'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  resize(); window.addEventListener('resize', resize); tick();
})();

(function particles() {
  var c = document.getElementById('fx'); var ctx = c.getContext('2d');
  var w, h, dots = [];
  function resize() {
    w = c.width = window.innerWidth; h = c.height = window.innerHeight;
    dots = [];
    for (var i = 0; i < 28; i++) {
      dots.push({
        x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5 + 0.3,
        vx: (Math.random() - 0.5) * 0.2, vy: -0.1 - Math.random() * 0.2, a: Math.random() * 0.35 + 0.08
      });
    }
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < dots.length; i++) {
      var p = dots[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -5) { p.y = h + 4; p.x = Math.random() * w; }
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(155,123,255,' + p.a + ')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  resize(); window.addEventListener('resize', resize); tick();
})();

var home = document.getElementById('home');
var chatView = document.getElementById('chat-view');
var chatEl = document.getElementById('chat');
var input = document.getElementById('input');
var sendBtn = document.getElementById('send');
var modeLabel = document.getElementById('mode-label');
var chatStatus = document.getElementById('chat-status');
var miniSlot = document.getElementById('mini-slot');
var HISTORY_KEY = 'pxax_ai_history';
var history = [];
try { history = JSON.parse(storage.getItem(HISTORY_KEY) || '[]'); } catch (e) { history = []; }
var chatBooted = false;

(async function pingApi() {
  try {
    var r = await fetch(AI_API_URL, { method: 'GET' });
    if (r.ok) {
      modeLabel.textContent = 'online · workers ai';
      chatStatus.textContent = 'online · llama';
    } else {
      modeLabel.textContent = 'api error';
      chatStatus.textContent = 'offline';
    }
  } catch (e) {
    modeLabel.textContent = 'offline';
    chatStatus.textContent = 'offline';
  }
})();

function haptic(t) {
  try {
    var h = Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback;
    if (!h) return;
    if (t === 'success') h.notificationOccurred('success');
    else if (t === 'error') h.notificationOccurred('error');
    else h.selectionChanged();
  } catch (e) {}
}
function setThinking(on) {
  charSlot.classList.toggle('think', on);
  miniSlot.classList.toggle('think', on);
}
function openChat() {
  haptic('select');
  home.classList.add('hidden');
  chatView.classList.add('open');
  if (!chatBooted) {
    chatBooted = true;
    if (history.length) {
      for (var i = 0; i < history.length; i++) addMsg(history[i].role, history[i].text, false);
    } else {
      var name = tgUser && tgUser.first_name;
      addMsg('bot', (name ? name + ', я' : 'Я') + ' на связи. Пиши что угодно — отвечу через нейросеть.', true);
    }
  }
  setTimeout(function () { input.focus(); }, 300);
}
function closeChat() {
  haptic('select');
  chatView.classList.remove('open');
  home.classList.remove('hidden');
  setThinking(false);
}
document.getElementById('btn-chat').onclick = openChat;
document.getElementById('btn-back').onclick = closeChat;

function addMsg(role, text, save) {
  if (save === undefined) save = true;
  var div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  if (role === 'bot') {
    div.innerHTML = '<div class="meta">' + BOT_NAME + '</div>' + escapeHtml(text).replace(/\n/g, '<br>');
  } else {
    div.textContent = text;
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  if (save) {
    history.push({ role: role, text: text, t: Date.now() });
    if (history.length > 80) history = history.slice(-80);
    storage.setItem(HISTORY_KEY, JSON.stringify(history));
  }
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function showTyping() {
  var div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.style.animation = 'none';
  div.innerHTML = '<div class="meta">' + BOT_NAME + '</div><div class="typing"><span></span><span></span><span></span></div>';
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() {
  var t = document.getElementById('typing');
  if (t) t.remove();
}

async function getReply(userText) {
  try {
    var res = await fetch(AI_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: userText,
        history: history.slice(-8).map(function (m) {
          return { role: m.role, text: m.text };
        })
      })
    });
    var data = await res.json();
    if (data && data.reply) return String(data.reply);
    return 'Пустой ответ от ИИ. Проверь Worker и binding AI.';
  } catch (e) {
    return 'Нет связи с ИИ: ' + (e.message || String(e));
  }
}

var busy = false;
async function send(text) {
  text = (text || input.value).trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  autoSize();
  haptic('select');
  addMsg('user', text);
  setThinking(true);
  showTyping();
  var reply = await getReply(text);
  hideTyping();
  setThinking(false);
  addMsg('bot', reply);
  if (/Workers AI error|Нет связи|binding|Пустой ответ/i.test(reply)) haptic('error');
  else haptic('success');
  busy = false;
  sendBtn.disabled = false;
  input.focus();
}
function autoSize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
}
sendBtn.onclick = function () { send(); };
input.oninput = autoSize;
input.onkeydown = function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
};
document.getElementById('suggest').onclick = function (e) {
  var b = e.target.closest('[data-q]');
  if (b) send(b.getAttribute('data-q'));
};
</script>
