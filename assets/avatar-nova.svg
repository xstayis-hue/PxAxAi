<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#241c3f"/>
      <stop offset="55%" stop-color="#0d0a1c"/>
      <stop offset="100%" stop-color="#060510"/>
    </radialGradient>
    <linearGradient id="rimL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b7bff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b69cff"/>
    </linearGradient>
    <linearGradient id="rimR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#5ce1e6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#9df2f5"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a63e0"/>
      <stop offset="100%" stop-color="#4a2f86"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33295a"/>
      <stop offset="100%" stop-color="#191430"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <!-- городские огни боке -->
  <circle cx="22" cy="30" r="5" fill="#9b7bff" opacity=".45"/>
  <circle cx="104" cy="22" r="4" fill="#5ce1e6" opacity=".5"/>
  <circle cx="112" cy="62" r="6" fill="#ff7bd5" opacity=".3"/>
  <circle cx="14" cy="72" r="4" fill="#5ce1e6" opacity=".3"/>
  <circle cx="94" cy="98" r="3.5" fill="#ffd27a" opacity=".35"/>

  <!-- персонаж, вид со спины (селфи от третьего лица) -->
  <g>
    <!-- плечи/куртка -->
    <path d="M28 128 C 30 98 44 84 64 84 C 84 84 98 98 100 128 Z" fill="url(#jacket)"/>
    <path d="M28 128 C 30 98 44 84 64 84 L 64 128 Z" fill="url(#rimL)" opacity=".5"/>
    <path d="M100 128 C 98 98 84 84 64 84 L 64 128 Z" fill="url(#rimR)" opacity=".5"/>
    <!-- шея -->
    <rect x="58" y="72" width="12" height="16" rx="6" fill="#d9c2f2"/>
    <!-- голова (вид сзади) -->
    <circle cx="64" cy="58" r="22" fill="#e3cff7"/>
    <!-- волосы -->
    <path d="M64 32 C 48 32 40 46 40 62 C 40 78 46 92 42 104 C 52 100 54 90 52 78 C 58 88 70 88 76 78 C 74 90 76 100 86 104 C 82 92 88 78 88 62 C 88 46 80 32 64 32 Z" fill="url(#hair)"/>
    <!-- rim-light на волосах -->
    <path d="M42 50 C 46 40 54 34 62 33 C 54 38 48 46 46 56 Z" fill="#cdb1ff" opacity=".7"/>
    <path d="M86 50 C 82 40 74 34 66 33 C 74 38 80 46 82 56 Z" fill="#9df2f5" opacity=".55"/>
    <!-- рука с телефоном (справа, впереди — селфи) -->
    <g transform="translate(88,96) rotate(-18)">
      <rect x="0" y="-8" width="14" height="26" rx="3" fill="#0c0a18" stroke="#5ce1e6" stroke-opacity=".6"/>
      <rect x="2" y="-5" width="10" height="18" rx="1.5" fill="#1b1540"/>
      <circle cx="7" cy="-1" r="1.4" fill="#9df2f5"/>
    </g>
    <path d="M84 118 C 86 108 90 102 96 100 L 100 112 C 96 116 92 120 92 128 L 82 128 Z" fill="#d9c2f2"/>
  </g>

  <!-- тонкая неоновая рамка -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="20" fill="none" stroke="#9b7bff" stroke-opacity=".45"/>
</svg>
