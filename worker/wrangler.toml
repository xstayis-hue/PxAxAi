name = "pxaxai"
main = "index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Cron:
#  0 7 * * *   — утренний персональный дайджест по состоянию
#  0 */3 * * * — «жизнь»: сервер догоняет потребности и решает, писать ли первой
[triggers]
crons = ["0 7 * * *", "0 */3 * * *"]

[ai]
binding = "AI"

# Основное хранилище: KV. Здесь лежат saves, память, промокоды,
# отложенные сообщения и rate-limit (ключи save:, mem:, push:, code:, pend:, rl:).
[[kv_namespaces]]
binding = "MEMORY"
id = "a1e886f2a23a442c85d7b43580b7dea7"

# --- D1: строгая атомарность промокодов и SQL по всем юзерам ---
# KV (MEMORY) остаётся кэшем/фолбэком; D1 — основное хранилище, когда binding есть.
[[d1_databases]]
binding = "DB"
database_name = "pxaxbyte"
database_id = "aac92270-c582-4673-ae66-5a3ad74ef78b"
